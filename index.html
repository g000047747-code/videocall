<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>通話</title>
<style>
:root{
  --bg:#0d1b24; --panel:#14293a; --line:#26465d; --ink:#e8f1f6; --sub:#8aa6b8;
  --on:#3ddc97; --off:#ff5d73; --accent:#f2b84b;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
.screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.screen.show{display:flex}

/* 入室 */
#join h1{font-size:28px;letter-spacing:.08em;font-weight:700}
.field{width:min(320px,100%);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:18px;text-align:center;outline:none}
.field:focus-visible{border-color:var(--accent)}
.primary{width:min(320px,100%);background:var(--accent);color:#1b1405;border:0;border-radius:14px;
  padding:14px;font-size:18px;font-weight:700;cursor:pointer}
.primary:disabled{opacity:.5}
#err{color:var(--off);font-size:14px;min-height:20px;text-align:center}

/* 通話 */
#call{justify-content:space-between;padding:0}
#status{margin-top:28px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub)}
#dot{width:10px;height:10px;border-radius:50%;background:var(--sub)}
#dot.live{background:var(--on);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
#roomName{font-size:22px;font-weight:700;color:var(--ink);margin-top:4px}
#center{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;padding:0 16px}

#videos{display:none;width:100%;max-width:520px}
#videos.show{display:block}
.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;cursor:pointer;border:1.5px solid var(--line)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
#localTile{display:none}
.tile span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 9px;font-size:12px}
.tile.full{position:fixed;inset:0;z-index:50;border-radius:0;aspect-ratio:auto;border:0;background:#000}
.tile.full video{object-fit:contain}

#bar{display:flex;gap:20px;padding:20px 0 32px;flex-wrap:wrap;justify-content:center;max-width:420px}
.round{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:var(--panel);outline:1.5px solid var(--line);transition:transform .12s, background .2s;flex-shrink:0}
.round:active{transform:scale(.92)}
.round:focus-visible{outline:2.5px solid var(--accent)}
.round svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.round.small{width:56px;height:56px}
.round.small svg{width:24px;height:24px}
.round.hidden{display:none}
#micBtn{background:var(--on);color:#06251a;outline:0}
#micBtn.muted{background:var(--off);color:#2b0710}
#keyBtn.open{background:var(--accent);color:#1b1405;outline:0}
#recBtn.active{background:var(--off);color:#2b0710;outline:0;animation:recpulse 1.4s infinite}
@keyframes recpulse{50%{opacity:.6}}

/* パスワード */
#pw{position:fixed;inset:0;z-index:40;background:rgba(5,12,17,.78);display:none;align-items:center;justify-content:center;padding:24px}
#pw.show{display:flex}
#pwBox{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:24px;width:min(320px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
#pwBox .field{background:var(--bg);letter-spacing:.5em;font-size:24px}
#pwBox.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pwBox .ghost{background:none;border:0;color:var(--sub);padding:6px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="screen show" id="join">
  <h1>通話</h1>
  <input class="field" id="roomInput" placeholder="ルーム名" maxlength="30" autocomplete="off" autocapitalize="off">
  <button class="primary" id="joinBtn">入室</button>
  <div id="err"></div>
</section>

<section class="screen" id="call">
  <div style="text-align:center">
    <div id="status"><span id="dot"></span><span id="statusText">接続中</span></div>
    <div id="roomName"></div>
  </div>

  <div id="center">
    <div id="videos">
      <div class="tile" id="remoteTile"><video id="remoteVideo" autoplay playsinline muted></video><span>相手</span></div>
      <div class="tile" id="localTile"><video id="localVideo" autoplay playsinline muted></video><span>自分</span></div>
    </div>
  </div>

  <div id="bar">
    <button class="round" id="micBtn" aria-label="マイク">
      <svg viewBox="0 0 24 24" id="micOn"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg viewBox="0 0 24 24" id="micOff" style="display:none"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>
    </button>
    <button class="round" id="keyBtn" aria-label="鍵">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
    </button>
    <button class="round small hidden" id="flipLocalBtn" aria-label="自分のカメラ切替">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <button class="round small hidden" id="flipRemoteBtn" aria-label="相手のカメラ切替">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M21 13v2a4 4 0 0 1-4 4H3"/><circle cx="12" cy="12" r="2"/></svg>
    </button>
    <button class="round small hidden" id="recBtn" aria-label="録画">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="7"/></svg>
    </button>
  </div>
</section>

<div id="pw">
  <div id="pwBox">
    <input class="field" id="pwInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button class="primary" id="pwOk">決定</button>
    <button class="ghost" id="pwCancel">閉じる</button>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ▼ Firebaseコンソールの「プロジェクトの設定」にある値に置き換えてください */
const firebaseConfig = {
  apiKey: "AIzaSyAn7qiZyLMYUcakP4gtsSZ-Euj88a5d8J0",
  authDomain: "videotool-5a4c1.firebaseapp.com",
  projectId: "videotool-5a4c1",
  storageBucket: "videotool-5a4c1.firebasestorage.app",
  messagingSenderId: "301551052506",
  appId: "1:301551052506:web:c54f87eca9b36e62d8e7e3"
};
/* ▲ */

const PASSWORD = "1919";

/* 無料の公開TURN（openrelay.metered.ca）。回線が厳しい環境でも繋がるよう標準で有効にしています。
   登録不要で誰でも使える無料の中継サーバーです。混雑時は速度が落ちることがあります。
   自分専用のTURNが欲しい場合は、metered.ca で無料アカウントを作り、ここを置き換えてください。 */
const TURN_URLS = [
  "turn:openrelay.metered.ca:80",
  "turn:openrelay.metered.ca:443",
  "turn:openrelay.metered.ca:443?transport=tcp"
];
const TURN_USER = "openrelayproject";
const TURN_PASS = "openrelayproject";

const iceServers = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }];
if(TURN_URLS.length) iceServers.push({ urls: TURN_URLS, username: TURN_USER, credential: TURN_PASS });
const ICE = { iceServers };
let isCaller = false;

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
let pc, localStream, remoteStream, roomRef, unsubs = [];
let unlocked = false;
let facingMode = "user";
let mySignalField, peerSignalField; // "callerFlip" / "calleeFlip"
let mediaRecorder, recordedChunks = [], recordStream;
let currentRoom = null;
let reconnectTimer = null;
let reconnecting = false;
let videoSender = null;
let videoSendingOn = false;
let audioSender = null, videoWanted = false, remoteVideoStream, remoteAudioStream, wakeLock = null;

function setStatus(text, live){
  $("statusText").textContent = text;
  $("dot").classList.toggle("live", !!live);
}

/* ---------- 入室 ---------- */
$("joinBtn").onclick = async () => {
  const room = $("roomInput").value.trim();
  if(!room){ $("err").textContent = "ルーム名を入力してください"; return; }
  $("err").textContent = "";
  $("joinBtn").disabled = true;

  try{
    // マイクとカメラの許可を求める
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 },
      video:{ facingMode:"user", ...VIDEO_CONSTRAINTS }
    });
  }catch(e){
    $("err").textContent = "マイクとカメラの使用を許可してください";
    $("joinBtn").disabled = false;
    return;
  }

  $("localVideo").srcObject = localStream;
  $("roomName").textContent = room;
  $("join").classList.remove("show");
  $("call").classList.add("show");
  setStatus("接続中", false);

  currentRoom = room;
  try{
    await start(room);
  }catch(e){
    console.error(e);
    setStatus("接続できませんでした", false);
  }
};
$("roomInput").addEventListener("keydown", e => { if(e.key === "Enter") $("joinBtn").click(); });

/* ---------- WebRTC + Firestore ---------- */
async function start(room){
  pc = new RTCPeerConnection(ICE);
  // 送るSDPに音声の低ビットレート/FEC/DTX設定を入れる（受信側の希望として相手の送信に反映される）
  for(const k of ["createOffer","createAnswer"]){
    const f = pc[k].bind(pc);
    pc[k] = async o => { const d = await f(o); return { type:d.type, sdp:tuneSdp(d.sdp) }; };
  }
  remoteStream = new MediaStream();
  remoteVideoStream = new MediaStream();
  remoteAudioStream = new MediaStream();
  $("remoteVideo").srcObject = remoteVideoStream;
  $("remoteAudio").srcObject = remoteAudioStream;

  // 音声は常時送信。映像トラックも最初から接続だけはしておき、enabledで送信on/offする
  // （addTrack/removeTrackを繰り返すと再ネゴシエーションが不安定になりやすいため）
  localStream.getAudioTracks().forEach(t => { audioSender = pc.addTrack(t, localStream); });
  const vTrack = localStream.getVideoTracks()[0];
  if(vTrack){
    vTrack.enabled = false;
    try{ vTrack.contentHint = "motion"; }catch(e){}
    // 映像は別ストリームにして、映像のバッファが音声の遅延を増やさないようにする
    videoSender = pc.addTrack(vTrack, new MediaStream([vTrack]));
  }
  videoSendingOn = false;
  pc.ontrack = e => {
    const t = e.track;
    if(!remoteStream.getTracks().includes(t)) remoteStream.addTrack(t);
    const dst = t.kind === "video" ? remoteVideoStream : remoteAudioStream;
    if(!dst.getTracks().includes(t)) dst.addTrack(t);
    if(t.kind === "video"){ rxVideo = e.receiver; setJitter(); t.onunmute = () => { if(unlocked) $("remoteVideo").play().catch(()=>{}); }; }
    $("remoteAudio").play().catch(()=>{});
  };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if(s === "connected"){
      setStatus("通話中", true);
      startMonitor(); requestWakeLock();
      reconnecting = false;
      if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    }
    else if(s === "connecting") setStatus("接続中", false);
    else if(s === "disconnected"){
      // 一時的な乱れでもこの状態になるため、ここでは繋ぎ直さず様子を見るだけにする
      setStatus("接続が不安定です…", false);
      setTimeout(() => { if(pc && pc.connectionState === "disconnected") scheduleReconnect(0); }, 5000);
    }
    else if(s === "failed"){
      setStatus("再接続中…", false);
      scheduleReconnect(500);
    }
  };

  roomRef = db.collection("rooms").doc(room);
  const snap = await roomRef.get();
  const data = snap.exists ? snap.data() : null;

  if(data && data.offer && !data.answer){
    await joinAsCallee();
  }else{
    await createAsCaller();
  }

  // 相手からのカメラ切替リクエストを監視
  unsubs.push(roomRef.onSnapshot(s => {
    const d = s.data();
    if(!d || !mySignalField) return;
    const req = d[mySignalField];
    if(req && req !== lastHandledSignal){
      lastHandledSignal = req;
      flipLocalCamera();
    }
  }));
}
let lastHandledSignal = null;

function startSendingVideo(){
  if(videoSendingOn) return;
  const track = localStream && localStream.getVideoTracks()[0];
  if(!track) return;
  track.enabled = true;
  videoSendingOn = true;
  videoWanted = true; videoOnAt = Date.now();
  if(level >= 5) level = 3;
  applyParams();
}

function stopSendingVideo(){
  if(!videoSendingOn) return;
  const track = localStream && localStream.getVideoTracks()[0];
  if(track) track.enabled = false;
  videoSendingOn = false;
  videoWanted = false; applyParams();
}

let negotiating = false;
async function renegotiate(){
  if(!roomRef || negotiating) return;
  negotiating = true;
  try{
    if(isCaller){
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await roomRef.update({ offer:{ type:offer.type, sdp:offer.sdp }, answer: firebase.firestore.FieldValue.delete() });
    }else{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await roomRef.update({ calleeOffer:{ type:offer.type, sdp:offer.sdp } });
    }
  }catch(e){ console.error("再ネゴシエーションエラー", e); }
  negotiating = false;
}

function scheduleReconnect(delay){
  if(reconnecting) return;
  reconnecting = true;
  if(reconnectTimer) clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(doReconnect, delay);
}

async function doReconnect(){
  if(!pc || !roomRef) { reconnecting = false; return; }
  try{
    if(isCaller){
      const offer = await pc.createOffer({ iceRestart: true });
      await pc.setLocalDescription(offer);
      await roomRef.update({ offer:{ type:offer.type, sdp:offer.sdp }, answer: firebase.firestore.FieldValue.delete(), restartAt: Date.now() });
    }
    // callee側はcallerの新しいofferをonSnapshotで検知して応答する
  }catch(e){
    console.error("再接続エラー", e);
  }
  reconnecting = false;
}

async function clearCandidates(){
  for(const name of ["callerCandidates","calleeCandidates"]){
    const qs = await roomRef.collection(name).get();
    const batch = db.batch();
    qs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}

async function createAsCaller(){
  isCaller = true;
  mySignalField = "callerFlip";
  peerSignalField = "calleeFlip";
  await clearCandidates();
  const callerCol = roomRef.collection("callerCandidates");
  const calleeCol = roomRef.collection("calleeCandidates");

  pc.onicecandidate = e => { if(e.candidate) callerCol.add(e.candidate.toJSON()); };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await roomRef.set({ offer:{ type:offer.type, sdp:offer.sdp }, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  setStatus("相手を待っています", false);

  let lastAppliedAnswerSdp = null;
  let lastAppliedCalleeOfferSdp = null;
  unsubs.push(roomRef.onSnapshot(async s => {
    const d = s.data();
    if(d && d.answer && d.answer.sdp !== lastAppliedAnswerSdp){
      lastAppliedAnswerSdp = d.answer.sdp;
      try{ await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); }catch(e){ console.error(e); }
    }
    if(d && d.calleeOffer && d.calleeOffer.sdp !== lastAppliedCalleeOfferSdp){
      lastAppliedCalleeOfferSdp = d.calleeOffer.sdp;
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(d.calleeOffer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await roomRef.update({ calleeOfferAnswer:{ type:answer.type, sdp:answer.sdp } });
      }catch(e){ console.error(e); }
    }
  }));
  unsubs.push(calleeCol.onSnapshot(s => {
    s.docChanges().forEach(c => { if(c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{}); });
  }));
}

async function joinAsCallee(){
  mySignalField = "calleeFlip";
  peerSignalField = "callerFlip";
  const callerCol = roomRef.collection("callerCandidates");
  const calleeCol = roomRef.collection("calleeCandidates");

  pc.onicecandidate = e => { if(e.candidate) calleeCol.add(e.candidate.toJSON()); };

  async function answerOffer(offer){
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await roomRef.update({ answer:{ type:answer.type, sdp:answer.sdp } });
  }

  const firstOffer = (await roomRef.get()).data().offer;
  await answerOffer(firstOffer);
  let lastAppliedOfferSdp = firstOffer.sdp;

  let lastAppliedCalleeOfferAnswerSdp = null;
  unsubs.push(roomRef.onSnapshot(async s => {
    const d = s.data();
    if(d && d.offer && d.offer.sdp !== lastAppliedOfferSdp){
      lastAppliedOfferSdp = d.offer.sdp;
      try{ await answerOffer(d.offer); }catch(e){ console.error(e); }
    }
    if(d && d.calleeOfferAnswer && d.calleeOfferAnswer.sdp !== lastAppliedCalleeOfferAnswerSdp){
      lastAppliedCalleeOfferAnswerSdp = d.calleeOfferAnswer.sdp;
      try{ await pc.setRemoteDescription(new RTCSessionDescription(d.calleeOfferAnswer)); }catch(e){ console.error(e); }
    }
  }));
  unsubs.push(callerCol.onSnapshot(s => {
    s.docChanges().forEach(c => { if(c.type === "added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{}); });
  }));
}

/* ---------- 回線に合わせた自動調整 ---------- */
const VIDEO_CONSTRAINTS = { width:{ ideal:640 }, height:{ ideal:480 }, frameRate:{ ideal:24, max:30 } };
// 画質の段階。悪くなると下へ、安定すると少しずつ上へ。最後は映像を止めて音声を守る
const VIDEO_LEVELS = [
  { scale:1,    fps:24, kbps:700 },
  { scale:1.33, fps:20, kbps:400 },
  { scale:2,    fps:15, kbps:220 },
  { scale:2.67, fps:10, kbps:120 },
  { scale:4,    fps:8,  kbps:60 },
  null
];
const AUDIO_KBPS = [32, 32, 32, 20, 12, 12];
let videoOnAt = 0, level = 0, goodCount = 0, lastChange = 0, monitorTimer = null;
let rxVideo = null, jitterMs = 250, lastFreeze = 0, calmCount = 0, lastDecoded = 0, stall = 0;

function tuneSdp(sdp){
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/);
  if(!m) return sdp;
  const pt = m[1];
  const params = "minptime=20;useinbandfec=1;usedtx=1;stereo=0;sprop-stereo=0;maxaveragebitrate=24000";
  const re = new RegExp("a=fmtp:" + pt + " [^\\r\\n]*");
  if(re.test(sdp)) return sdp.replace(re, "a=fmtp:" + pt + " " + params);
  return sdp.replace(m[0], m[0] + "\r\na=fmtp:" + pt + " " + params);
}

async function applyParams(){
  try{
    if(videoSender){
      const p = videoSender.getParameters();
      if(p.encodings && p.encodings.length){
        const L = VIDEO_LEVELS[level], e = p.encodings[0];
        e.active = videoWanted && !!L;
        if(L){ e.scaleResolutionDownBy = L.scale; e.maxFramerate = L.fps; e.maxBitrate = L.kbps * 1000; }
        e.priority = "low"; e.networkPriority = "low";
        await videoSender.setParameters(p);
      }
    }
  }catch(e){ console.warn("video params", e); }
  try{
    if(audioSender){
      const p = audioSender.getParameters();
      if(p.encodings && p.encodings.length){
        p.encodings[0].maxBitrate = AUDIO_KBPS[level] * 1000;
        p.encodings[0].priority = "high"; p.encodings[0].networkPriority = "high";
        await audioSender.setParameters(p);
      }
    }
  }catch(e){ console.warn("audio params", e); }
}

function setJitter(){
  if(!rxVideo) return;
  try{ rxVideo.jitterBufferTarget = jitterMs; }catch(e){}
  try{ rxVideo.playoutDelayHint = jitterMs / 1000; }catch(e){}
}

function refreshRemoteVideo(){
  const v = $("remoteVideo");
  v.srcObject = null; v.srcObject = remoteVideoStream;
  v.play().catch(()=>{});
}

function startMonitor(){
  if(monitorTimer) return;
  applyParams();
  monitorTimer = setInterval(monitor, 2000);
}

async function monitor(){
  if(!pc || pc.connectionState !== "connected") return;
  const L = VIDEO_LEVELS[level], sendingVideo = videoWanted && !!L;
  let loss = 0, rtt = 0, avail = 0, freeze = 0, decoded = 0;
  try{
    (await pc.getStats()).forEach(r => {
      if(r.type === "remote-inbound-rtp" && (r.kind === "audio" || sendingVideo)) loss = Math.max(loss, r.fractionLost || 0);
      if(r.type === "candidate-pair" && r.nominated && r.state === "succeeded"){ rtt = r.currentRoundTripTime || 0; avail = r.availableOutgoingBitrate || 0; }
      if(r.type === "inbound-rtp" && r.kind === "video"){ freeze = r.freezeCount || 0; decoded = r.framesDecoded || 0; }
    });
  }catch(e){ return; }

  // 送信側：悪ければすぐ下げ、良い状態が続いたら少しずつ戻す
  const now = Date.now();
  // 帯域推定は映像を送り始めてしばらくは低く出るので、10秒待ってから、最後の段（映像停止）までは落とさない
  const tooBig = sendingVideo && now - videoOnAt > 10000 && level < 4 && avail && avail < (L.kbps + AUDIO_KBPS[level]) * 1000 * 0.6;
  if(loss > 0.04 || rtt > 0.45 || tooBig){
    goodCount = 0;
    const step = (loss > 0.15 || rtt > 0.9) ? 2 : 1;
    if(level < 5 && now - lastChange > 1500){ level = Math.min(5, level + step); lastChange = now; applyParams(); }
  }else if(loss < 0.01 && rtt < 0.25 && level > 0){
    if(++goodCount >= (level === 5 ? 8 : 5)){ level--; goodCount = 0; lastChange = now; applyParams(); }
  }

  // 受信側：カクつきが出たら映像のバッファを増やし、落ち着いたら戻す
  if(freeze > lastFreeze){ jitterMs = Math.min(1000, jitterMs + 150); calmCount = 0; setJitter(); }
  else if(++calmCount > 10 && jitterMs > 250){ jitterMs -= 50; calmCount = 0; setJitter(); }
  lastFreeze = freeze;

  // 映像が描画されたまま止まったら、表示を貼り直す
  const rt = remoteVideoStream.getVideoTracks()[0];
  if(unlocked && !document.hidden && rt && !rt.muted && decoded > 0 && decoded === lastDecoded){ if(++stall === 2) refreshRemoteVideo(); }
  else stall = 0;
  lastDecoded = decoded;
}

async function requestWakeLock(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.onrelease = () => { wakeLock = null; };
    }
  }catch(e){}
}

document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  $("remoteAudio").play().catch(()=>{});
  if(unlocked){ refreshRemoteVideo(); $("localVideo").play().catch(()=>{}); }
  const t = localStream && localStream.getVideoTracks()[0];
  if(t && t.readyState === "ended") flipLocalCamera(false);
  if(pc) requestWakeLock();
});

/* ---------- マイク ---------- */
$("micBtn").onclick = () => {
  const track = localStream && localStream.getAudioTracks()[0];
  if(!track) return;
  track.enabled = !track.enabled;
  const muted = !track.enabled;
  $("micBtn").classList.toggle("muted", muted);
  $("micOn").style.display = muted ? "none" : "";
  $("micOff").style.display = muted ? "" : "none";
};

/* ---------- 自分のカメラ切替（内カメ/外カメ） ---------- */
async function flipLocalCamera(toggle = true){
  if(toggle) facingMode = facingMode === "user" ? "environment" : "user";
  try{
    const newStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode, ...VIDEO_CONSTRAINTS } });
    const newTrack = newStream.getVideoTracks()[0];
    try{ newTrack.contentHint = "motion"; }catch(e){}
    newTrack.enabled = videoSendingOn;
    const oldTrack = localStream.getVideoTracks()[0];
    if(videoSender){
      // 映像を送信中なら replaceTrack で切り替え（再ネゴシエーション不要）
      await videoSender.replaceTrack(newTrack);
    }
    if(oldTrack){ localStream.removeTrack(oldTrack); oldTrack.stop(); }
    localStream.addTrack(newTrack);
    $("localVideo").srcObject = null;
    $("localVideo").srcObject = localStream;
  }catch(e){ console.error(e); }
}
$("flipLocalBtn").onclick = () => flipLocalCamera();

/* ---------- 相手のカメラ切替を要求 ---------- */
$("flipRemoteBtn").onclick = () => {
  if(!roomRef || !peerSignalField) return;
  roomRef.update({ [peerSignalField]: Date.now() }).catch(()=>{});
};

/* ---------- 録画 ---------- */
$("recBtn").onclick = () => {
  if(mediaRecorder && mediaRecorder.state === "recording"){
    mediaRecorder.stop();
    return;
  }
  try{
    recordStream = new MediaStream();
    $("localVideo").srcObject.getVideoTracks().forEach(t => recordStream.addTrack(t));
    $("remoteVideo").srcObject.getVideoTracks().forEach(t => recordStream.addTrack(t));
    remoteStream.getAudioTracks().forEach(t => recordStream.addTrack(t));
    localStream.getAudioTracks().forEach(t => recordStream.addTrack(t));

    recordedChunks = [];
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus") ? "video/webm;codecs=vp9,opus" : "video/webm";
    mediaRecorder = new MediaRecorder(recordStream, { mimeType: mime });
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type:"video/webm" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `call_${Date.now()}.webm`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      $("recBtn").classList.remove("active");
    };
    mediaRecorder.start();
    $("recBtn").classList.add("active");
  }catch(e){
    console.error(e);
    alert("この端末では録画に対応していません");
  }
};

/* ---------- 鍵 / パスワード ---------- */
$("keyBtn").onclick = () => {
  if(unlocked){ setVideos(false); return; }
  $("pwInput").value = "";
  $("pw").classList.add("show");
  setTimeout(() => $("pwInput").focus(), 50);
};
$("pwCancel").onclick = () => $("pw").classList.remove("show");
$("pwOk").onclick = checkPw;
$("pwInput").addEventListener("keydown", e => { if(e.key === "Enter") checkPw(); });

function checkPw(){
  if($("pwInput").value === PASSWORD){
    $("pw").classList.remove("show");
    setVideos(true);
  }else{
    const box = $("pwBox");
    box.classList.remove("bad"); void box.offsetWidth; box.classList.add("bad");
    $("pwInput").value = "";
  }
}

function setVideos(on){
  unlocked = on;
  $("videos").classList.toggle("show", on);
  $("keyBtn").classList.toggle("open", on);
  $("flipLocalBtn").classList.toggle("hidden", !on);
  $("flipRemoteBtn").classList.toggle("hidden", !on);
  $("recBtn").classList.toggle("hidden", !on);
  if(on){
    $("remoteVideo").play().catch(()=>{});
    $("localVideo").play().catch(()=>{});
    startSendingVideo();
  }else{
    stopSendingVideo();
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    document.querySelectorAll(".tile.full").forEach(t => t.classList.remove("full"));
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }
}

/* ---------- タップで全画面 ---------- */
document.querySelectorAll(".tile").forEach(tile => {
  tile.addEventListener("click", () => {
    const isFull = tile.classList.contains("full");
    document.querySelectorAll(".tile.full").forEach(t => t.classList.remove("full"));
    if(isFull){
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      return;
    }
    tile.classList.add("full");
    if(tile.requestFullscreen) tile.requestFullscreen().catch(()=>{});
    else if(tile.webkitRequestFullscreen) tile.webkitRequestFullscreen();
  });
});
document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement) document.querySelectorAll(".tile.full").forEach(t => t.classList.remove("full"));
});

/* ---------- 退出時の後片付け ---------- */
window.addEventListener("pagehide", () => {
  if(reconnectTimer) clearTimeout(reconnectTimer);
  if(monitorTimer) clearInterval(monitorTimer);
  if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
  unsubs.forEach(u => u());
  if(isCaller && roomRef) roomRef.delete().catch(()=>{});
  if(pc) pc.close();
  if(localStream) localStream.getTracks().forEach(t => t.stop());
});
</script>
</body>
